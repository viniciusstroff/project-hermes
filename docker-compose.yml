networks:
  hermes-net:
    name: hermes-net

services:
  app:
    build:
      context: ./
      args:
        # Vazio: imagem sem pg_dump nem psql. Veja o Dockerfile.
        PG_CLIENT_VERSION: ${PG_CLIENT_VERSION:-}
    container_name: project-hermes
    volumes:
      - ./:/home/project-hermes
    networks:
      - hermes-net
    ports:
      - "5678:5678"
    extra_hosts:
      - "host.docker.internal:host-gateway"
